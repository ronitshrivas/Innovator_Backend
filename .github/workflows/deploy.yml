name: Deploy to server

# Deploys on every push to main. You can also trigger it manually from the
# GitHub Actions tab (workflow_dispatch).
"on":
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            cd ~/InnovatorBackend
            git fetch --all --prune
            git reset --hard origin/main
            # Build fresh images, then recreate containers cleanly. --force-recreate
            # avoids "container name already in use" conflicts from stale containers.
            docker compose build
            docker compose up -d --force-recreate --remove-orphans
            docker image prune -f || true
            docker compose ps
